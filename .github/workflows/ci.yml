# The one job named ci is what the main branch ruleset requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the tools the tests use
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: shellcheck
        env:
          # cgwalters' older scripts, from before this check.
          LEGACY: bin/git-hubclone bin/git-multigrep bin/git-pr bin/makesudoinstall
        run: |
          { grep -lE '^#!.*[/ ](ba)?sh$' bin/* tests/*.sh; ls bin/*.sh; } | sort -u |
            grep -vxF -f <(tr ' ' '\n' <<<"${LEGACY}") | xargs shellcheck -x
      - name: node --check
        run: grep -lE '^#!.*[/ ]node$' bin/* | xargs -n1 node --check
      - name: tests
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          rc=0
          for t in tests/*.sh; do echo "::group::${t}"; bash "${t}" || { echo "::error::${t} failed"; rc=1; }; echo "::endgroup::"; done
          exit "${rc}"
